<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#060606" />

  <title>Yazonii — Web Design & Development</title>

  <style>
    :root {
      --orange: #ff6900;
      --orange-light: #ff9b4a;
      --black: #060606;
      --white: #fff;
      --muted: rgba(255,255,255,.68);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Inter, Arial, sans-serif;
      background: #060606;
      color: var(--white);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =====================================================
       DAY HERO
    ===================================================== */

    .day-scene {
      position: relative;
      height: 100svh;
      min-height: 720px;
      overflow: hidden;
      color: #071116;

      background:
        linear-gradient(
          180deg,
          #69c9f3 0%,
          #8fd9f7 35%,
          #bfe9ef 63%,
          #e8e6ca 82%,
          #ffd28c 100%
        );
    }

    .day-scene::before {
      content: "";
      position: absolute;
      inset: 0;

      background:
        radial-gradient(
          circle at 50% 25%,
          rgba(255,255,255,.42),
          transparent 28%
        ),
        linear-gradient(
          180deg,
          transparent 55%,
          rgba(255,215,150,.2)
        );

      pointer-events: none;
    }

    /* =====================================================
       SUN
    ===================================================== */

    .sun {
      position: absolute;

      width: clamp(100px, 13vw, 175px);
      aspect-ratio: 1;

      left: 50%;
      top: 24%;

      transform: translate(-50%, -50%);

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 35% 32%,
          #fffef0 0%,
          #fff6b2 34%,
          #ffd75d 67%,
          #ffad2d 100%
        );

      box-shadow:
        0 0 45px rgba(255,232,125,.95),
        0 0 115px rgba(255,194,62,.55),
        0 0 190px rgba(255,179,40,.25);

      z-index: 1;

      animation:
        sunFloat 7s ease-in-out infinite,
        sunGlow 4s ease-in-out infinite alternate;
    }

    @keyframes sunFloat {
      0%,100% {
        transform: translate(-50%, -50%) translateY(0);
      }

      50% {
        transform: translate(-50%, -50%) translateY(-10px);
      }
    }

    @keyframes sunGlow {
      from {
        box-shadow:
          0 0 45px rgba(255,232,125,.9),
          0 0 110px rgba(255,194,62,.5),
          0 0 180px rgba(255,179,40,.2);
      }

      to {
        box-shadow:
          0 0 60px rgba(255,240,150,1),
          0 0 145px rgba(255,200,70,.65),
          0 0 220px rgba(255,179,40,.28);
      }
    }

    /* =====================================================
       CLOUDS
    ===================================================== */

    .cloud {
      position: absolute;

      width: 190px;
      height: 48px;

      border-radius: 100px;

      background: rgba(255,255,255,.52);

      filter: blur(.25px);

      box-shadow:
        0 10px 35px rgba(255,255,255,.1);

      z-index: 2;
    }

    .cloud::before,
    .cloud::after {
      content: "";

      position: absolute;

      border-radius: 50%;

      background: inherit;
    }

    .cloud::before {
      width: 75px;
      height: 75px;

      left: 28px;
      bottom: 12px;
    }

    .cloud::after {
      width: 95px;
      height: 95px;

      right: 22px;
      bottom: 5px;
    }

    .cloud-1 {
      top: 18%;
      left: 8%;

      transform: scale(.75);

      animation: cloudMoveOne 35s linear infinite;
    }

    .cloud-2 {
      top: 35%;
      right: 7%;

      transform: scale(.58);

      opacity: .65;

      animation: cloudMoveTwo 45s linear infinite;
    }

    .cloud-3 {
      top: 48%;
      left: 28%;

      transform: scale(.42);

      opacity: .5;

      animation: cloudMoveThree 55s linear infinite;
    }

    @keyframes cloudMoveOne {
      0% {
        margin-left: -20px;
      }

      50% {
        margin-left: 55px;
      }

      100% {
        margin-left: -20px;
      }
    }

    @keyframes cloudMoveTwo {
      0% {
        margin-right: 20px;
      }

      50% {
        margin-right: -60px;
      }

      100% {
        margin-right: 20px;
      }
    }

    @keyframes cloudMoveThree {
      0% {
        margin-left: 0;
      }

      50% {
        margin-left: -70px;
      }

      100% {
        margin-left: 0;
      }
    }

    /* =====================================================
       NAV
    ===================================================== */

    .logo {
      position: absolute;

      top: 28px;
      left: 7%;

      z-index: 30;

      font-size: 1.45rem;
      font-weight: 900;

      letter-spacing: -.07em;

      animation: navEnter .9s cubic-bezier(.2,.8,.2,1) both;
    }

    .logo span {
      color: var(--orange);
    }

    .nav-contact {
      position: absolute;

      top: 25px;
      right: 7%;

      z-index: 30;

      padding: 11px 17px;

      border-radius: 10px;

      background: rgba(255,255,255,.2);

      border:
        1px solid rgba(255,255,255,.35);

      backdrop-filter: blur(12px);

      font-size: .75rem;
      font-weight: 800;

      transition:
        transform .25s ease,
        background .25s ease,
        color .25s ease;
    }

    .nav-contact:hover {
      transform: translateY(-3px);

      background: white;

      color: #111;
    }

    @keyframes navEnter {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =====================================================
       HERO CONTENT
    ===================================================== */

    .hero-content {
      position: relative;

      z-index: 10;

      width: min(900px, 86%);

      margin: auto;

      padding-top: 22vh;
    }

    .eyebrow {
      display: flex;
      align-items: center;

      gap: 9px;

      margin-bottom: 24px;

      font-size: .7rem;
      font-weight: 900;

      letter-spacing: .17em;

      text-transform: uppercase;

      animation:
        heroFade .9s .15s cubic-bezier(.2,.8,.2,1) both;
    }

    .eyebrow::before {
      content: "";

      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--orange);

      animation: dotPulse 2s ease-in-out infinite;
    }

    @keyframes dotPulse {
      0%,100% {
        box-shadow: 0 0 0 0 rgba(255,105,0,.4);
      }

      50% {
        box-shadow: 0 0 0 7px rgba(255,105,0,0);
      }
    }

    h1 {
      max-width: 900px;

      font-size:
        clamp(3.6rem, 9vw, 8rem);

      line-height: .88;

      letter-spacing: -.085em;

      margin-bottom: 30px;

      animation:
        heroTitle 1.1s .2s cubic-bezier(.16,1,.3,1) both;
    }

    h1 span {
      color: var(--orange);
    }

    .hero-description {
      max-width: 590px;

      font-size:
        clamp(1rem, 2vw, 1.2rem);

      line-height: 1.6;

      color: rgba(7,17,22,.7);

      animation:
        heroFade 1s .45s cubic-bezier(.2,.8,.2,1) both;
    }

    @keyframes heroFade {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes heroTitle {
      from {
        opacity: 0;
        transform:
          translateY(45px)
          scale(.97);
      }

      to {
        opacity: 1;
        transform:
          translateY(0)
          scale(1);
      }
    }

    /* =====================================================
       SCROLL INDICATOR
    ===================================================== */

    .scroll-hint {
      position: absolute;

      left: 7%;
      bottom: 70px;

      z-index: 20;

      font-size: .68rem;
      font-weight: 800;

      letter-spacing: .16em;

      text-transform: uppercase;

      color: rgba(7,17,22,.65);

      animation:
        heroFade 1s 1s both;
    }

    .scroll-line {
      width: 1px;
      height: 55px;

      margin-top: 13px;

      background: rgba(7,17,22,.6);

      animation:
        scrollPulse 1.5s ease-in-out infinite;
    }

    @keyframes scrollPulse {
      0%,100% {
        transform: scaleY(.35);
        transform-origin: top;
      }

      50% {
        transform: scaleY(1);
        transform-origin: top;
      }
    }

    /* =====================================================
       LAYERED MOUNTAINS
    ===================================================== */

    .horizon {
      position: absolute;

      left: 0;
      bottom: -1px;

      width: 100%;
      height: 48vh;

      min-height: 260px;

      z-index: 7;

      pointer-events: none;
    }

    .hill {
      position: absolute;

      left: -5%;
      bottom: 0;

      width: 110%;
      height: 100%;

      transform-origin: bottom;
    }

    .hill-back {
      height: 90%;

      background:
        linear-gradient(
          180deg,
          #6a8588,
          #49666b
        );

      opacity: .88;

      clip-path: polygon(
        0 69%,
        7% 58%,
        15% 65%,
        24% 45%,
        33% 61%,
        43% 37%,
        52% 57%,
        61% 44%,
        71% 62%,
        80% 50%,
        90% 63%,
        100% 53%,
        100% 100%,
        0 100%
      );

      animation:
        mountainFloat 12s ease-in-out infinite;
    }

    .hill-middle {
      height: 77%;

      background:
        linear-gradient(
          180deg,
          #304b51,
          #20383d
        );

      clip-path: polygon(
        0 71%,
        10% 54%,
        19% 68%,
        30% 41%,
        39% 60%,
        48% 47%,
        57% 65%,
        69% 42%,
        78% 59%,
        88% 47%,
        100% 64%,
        100% 100%,
        0 100%
      );

      animation:
        mountainFloat 15s 1s ease-in-out infinite reverse;
    }

    .hill-front {
      height: 63%;

      background:
        linear-gradient(
          180deg,
          #13272b,
          #0a1719
        );

      clip-path: polygon(
        0 63%,
        12% 51%,
        21% 65%,
        34% 44%,
        44% 61%,
        56% 38%,
        67% 60%,
        78% 46%,
        89% 61%,
        100% 51%,
        100% 100%,
        0 100%
      );

      animation:
        mountainFloat 18s 2s ease-in-out infinite;
    }

    .hill-ground {
      height: 38%;

      background:
        linear-gradient(
          180deg,
          #081113,
          #060606
        );

      clip-path: polygon(
        0 29%,
        20% 19%,
        40% 27%,
        60% 15%,
        80% 26%,
        100% 16%,
        100% 100%,
        0 100%
      );
    }

    @keyframes mountainFloat {
      0%,100% {
        transform: translateX(0);
      }

      50% {
        transform: translateX(-1.2%);
      }
    }

    /* Soft gradient that connects the landscape to dark portfolio */

    .horizon-fade {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      height: 38%;

      z-index: 9;

      background:
        linear-gradient(
          180deg,
          rgba(6,6,6,0) 0%,
          rgba(6,6,6,.35) 35%,
          rgba(6,6,6,.82) 75%,
          #060606 100%
        );
    }

    /* =====================================================
       PORTFOLIO
    ===================================================== */

    .portfolio {
      position: relative;

      z-index: 10;

      background:
        radial-gradient(
          circle at 85% 0%,
          rgba(255,105,0,.15),
          transparent 30%
        ),
        #060606;

      padding:
        140px 7% 100px;
    }

    .portfolio-inner {
      max-width: 1150px;
      margin: auto;
    }

    .section-label {
      margin-bottom: 16px;

      color: var(--orange);

      font-size: .7rem;
      font-weight: 900;

      letter-spacing: .17em;

      text-transform: uppercase;
    }

    h2 {
      max-width: 850px;

      font-size:
        clamp(2.8rem, 6vw, 5.5rem);

      line-height: .94;

      letter-spacing: -.075em;

      margin-bottom: 70px;
    }

    /* =====================================================
       CARDS
    ===================================================== */

    .cards {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 18px;
    }

    .card {
      min-height: 275px;

      padding: 40px;

      border-radius: 24px;

      background:
        linear-gradient(
          145deg,
          rgba(255,105,0,.08),
          transparent 48%
        ),
        #111;

      border:
        1px solid rgba(255,255,255,.09);

      opacity: 0;

      transform:
        translateY(50px)
        scale(.98);

      transition:
        opacity .8s ease,
        transform .8s cubic-bezier(.16,1,.3,1),
        border-color .3s ease,
        box-shadow .3s ease;
    }

    .card.visible {
      opacity: 1;

      transform:
        translateY(0)
        scale(1);
    }

    .card:hover {
      border-color:
        rgba(255,105,0,.45);

      transform:
        translateY(-8px)
        scale(1.01);

      box-shadow:
        0 25px 70px rgba(0,0,0,.3);
    }

    .number {
      margin-bottom: 45px;

      color: var(--orange);

      font-size: .75rem;
      font-weight: 900;
    }

    .card h3 {
      margin-bottom: 12px;

      font-size: 1.5rem;

      letter-spacing: -.03em;
    }

    .card p {
      max-width: 450px;

      color: var(--muted);

      line-height: 1.65;
    }

    /* =====================================================
       PROCESS
    ===================================================== */

    .process {
      margin-top: 150px;
    }

    .process-row {
      display: grid;

      grid-template-columns:
        70px 1fr;

      gap: 20px;

      padding: 32px 0;

      border-top:
        1px solid rgba(255,255,255,.1);

      opacity: 0;

      transform: translateX(-35px);

      transition:
        opacity .75s ease,
        transform .75s cubic-bezier(.16,1,.3,1);
    }

    .process-row.visible {
      opacity: 1;

      transform: translateX(0);
    }

    .process-number {
      color: var(--orange);

      font-weight: 900;
    }

    .process-row h3 {
      margin-bottom: 8px;
    }

    .process-row p {
      color: var(--muted);

      line-height: 1.6;
    }

    /* =====================================================
       PRICING
    ===================================================== */

    .pricing {
      margin-top: 150px;
    }

    .price-grid {
      display: grid;

      grid-template-columns:
        repeat(2, 1fr);

      gap: 18px;
    }

    .price-card {
      padding: 40px;

      border-radius: 24px;

      background: #111;

      border:
        1px solid rgba(255,255,255,.09);

      transition:
        transform .35s ease,
        border-color .35s ease,
        box-shadow .35s ease;
    }

    .price-card:hover {
      transform: translateY(-8px);

      border-color:
        rgba(255,105,0,.4);

      box-shadow:
        0 25px 70px rgba(0,0,0,.3);
    }

    .price-card.featured {
      border-color:
        rgba(255,105,0,.5);

      background:
        radial-gradient(
          circle at 100% 0,
          rgba(255,105,0,.15),
          transparent 45%
        ),
        #111;
    }

    .price-card h3 {
      font-size: 1.4rem;
    }

    .price {
      margin: 14px 0;

      font-size: 3rem;

      font-weight: 900;

      letter-spacing: -.07em;
    }

    .price-card p {
      margin-bottom: 25px;

      color: var(--muted);

      line-height: 1.6;
    }

    .price-card ul {
      list-style: none;
    }

    .price-card li {
      margin: 11px 0;

      color: #ddd;
    }

    .price-card li::before {
      content: "✓";

      margin-right: 10px;

      color: var(--orange);

      font-weight: 900;
    }

    /* =====================================================
       CONTACT
    ===================================================== */

    .contact {
      margin-top: 150px;

      padding: 70px;

      border-radius: 30px;

      background:
        radial-gradient(
          circle at 90% 0,
          rgba(255,105,0,.2),
          transparent 35%
        ),
        #111;

      border:
        1px solid rgba(255,255,255,.1);

      opacity: 0;

      transform:
        translateY(45px);

      transition:
        opacity 1s ease,
        transform 1s cubic-bezier(.16,1,.3,1);
    }

    .contact.visible {
      opacity: 1;

      transform:
        translateY(0);
    }

    .contact h2 {
      margin-bottom: 20px;
    }

    .contact > p {
      max-width: 600px;

      margin-bottom: 30px;

      color: var(--muted);

      line-height: 1.65;
    }

    .contact-link {
      display: block;

      margin: 11px 0;

      font-weight: 700;

      transition:
        color .2s ease,
        transform .2s ease;
    }

    .contact-link:hover {
      color: var(--orange-light);

      transform: translateX(5px);
    }

    .button {
      display: inline-block;

      margin-top: 25px;

      padding: 15px 23px;

      border-radius: 11px;

      background:
        linear-gradient(
          135deg,
          #ff6200,
          #ff9b4a
        );

      color: white;

      font-weight: 900;

      box-shadow:
        0 15px 45px rgba(255,105,0,.22);

      transition:
        transform .25s ease,
        box-shadow .25s ease;
    }

    .button:hover {
      transform:
        translateY(-4px)
        scale(1.02);

      box-shadow:
        0 20px 60px rgba(255,105,0,.35);
    }

    /* =====================================================
       FOOTER
    ===================================================== */

    footer {
      padding: 40px 7%;

      background: #060606;

      color: #666;

      font-size: .8rem;
    }

    /* =====================================================
       MOBILE
    ===================================================== */

    @media (max-width: 700px) {

      .nav-contact {
        display: none;
      }

      .hero-content {
        padding-top: 20vh;
      }

      h1 {
        font-size:
          clamp(3.2rem, 15vw, 5.2rem);
      }

      .hero-description {
        font-size: 1rem;
      }

      .sun {
        top: 27%;
      }

      .cloud-1 {
        left: -30px;
      }

      .cloud-2 {
        right: -80px;
      }

      .horizon {
        height: 40vh;

        min-height: 230px;
      }

      .cards,
      .price-grid {
        grid-template-columns: 1fr;
      }

      .portfolio {
        padding:
          100px 7% 80px;
      }

      .process-row {
        grid-template-columns:
          50px 1fr;
      }

      .contact {
        padding:
          38px 25px;
      }
    }

    /* =====================================================
       REDUCED MOTION
    ===================================================== */

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;

        animation: none !important;

        transition-duration:
          .01ms !important;
      }
    }
  </style>
</head>

<body>

  <!-- ===================================================
       DAY WORLD
  ==================================================== -->

  <section class="day-scene">

    <a href="#" class="logo">
      Yazonii<span>.</span>
    </a>

    <a
      href="#contact"
      class="nav-contact"
    >
      Start a Project →
    </a>

    <div class="sun"></div>

    <div class="cloud cloud-1"></div>
    <div class="cloud cloud-2"></div>
    <div class="cloud cloud-3"></div>

    <div class="hero-content">

      <div class="eyebrow">
        Web Design & Development
      </
